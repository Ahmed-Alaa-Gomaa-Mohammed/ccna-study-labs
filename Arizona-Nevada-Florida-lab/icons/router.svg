<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="rSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="rTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  
  <!-- Subtle shadow base -->
  <ellipse cx="64" cy="102" rx="54" ry="16" fill="#94a3b8" opacity="0.4"/>

  <!-- Lower Cylinder Body -->
  <path d="M 12 56 L 12 86 A 52 26 0 0 0 116 86 L 116 56 Z" fill="url(#rSide)" stroke="#0c4a6e" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Top Face Ellipse -->
  <ellipse cx="64" cy="56" rx="52" ry="26" fill="url(#rTop)" stroke="#0c4a6e" stroke-width="2.5"/>

  <!-- Cisco 4 Cross Arrows -->
  <g fill="#ffffff" stroke="#ffffff" stroke-linejoin="round">
    <!-- Left Inward Arrow -->
    <line x1="24" y1="56" x2="48" y2="56" stroke-width="4.5" stroke-linecap="round"/>
    <polygon points="46,50 58,56 46,62"/>

    <!-- Right Inward Arrow -->
    <line x1="104" y1="56" x2="80" y2="56" stroke-width="4.5" stroke-linecap="round"/>
    <polygon points="82,50 70,56 82,62"/>

    <!-- Top Outward Arrow -->
    <line x1="64" y1="52" x2="64" y2="38" stroke-width="4.5" stroke-linecap="round"/>
    <polygon points="58,40 64,30 70,40"/>

    <!-- Bottom Outward Arrow -->
    <line x1="64" y1="60" x2="64" y2="74" stroke-width="4.5" stroke-linecap="round"/>
    <polygon points="58,72 64,82 70,72"/>
  </g>
</svg>